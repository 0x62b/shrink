<body><canvas id="c"></canvas><div style="margin: 16px;"><span>Interval:</span><span id="interval"></span><div><button style="padding: 16px" onclick="interval += 100">+</button><button style="padding: 16px;" onclick="interval -= interval == 0? 0 : 100">-</button></div><br/><button style="padding: 24px" onclick="clearTimeout(timeout); setup(); render();"> Reset </button></div><style>body{margin:0;background:black;color:white;display:flex;align-items:center}canvas{display:block}</style><script>let interval=1e3;const W=50,H=50,SIZE=Math.floor(Math.min(window.innerWidth,window.innerHeight)/50),c=document.getElementById("c"),ctx=c.getContext("2d");let game,timeout;function setup(){game=Array.from({length:W},()=>Array.from({length:H},()=>Math.random()<.3?1:0))}function count(e,t){let n=0;for(let r=-1;r<=1;r++)for(let l=-1;l<=1;l++)0===r&&0===l||(n+=game[(e+r+W)%W][(t+l+H)%H]);return n}function run(){var e=Array.from({length:W},()=>Array(H).fill(0));for(let t=0;t<W;t++)for(let n=0;n<H;n++){let r=count(t,n);game[t][n]?e[t][n]=2==r||3==r?1:0:e[t][n]=3==r?1:0}game=e}function render(){for(let e=0;e<W;e++)for(let t=0;t<H;t++)ctx.fillStyle=game[e][t]?"#0f0":"#222",ctx.fillRect(e*SIZE,t*SIZE,SIZE-1,SIZE-1);timeout=setTimeout(()=>{run(),render()},interval)}c.width=W*SIZE,c.height=H*SIZE,setup(),setTimeout(()=>{run(),render()},interval),setInterval(()=>document.getElementById("interval").innerText=interval,10);</script></body>
