<body>
  <canvas id="c"></canvas>
  <div style="margin: 16px;">
    <span>Interval:</span>
    <span id="interval"></span>
    <div>
      <button style="padding: 16px" onclick="interval += 100">+</button>
      <button style="padding: 16px;" onclick="interval -= interval == 0? 0 : 100">-</button>
    </div>
    <br/>
    <button style="padding: 24px" onclick="clearTimeout(timeout); setup(); render();">
      Reset
    </button>
  </div>
  <style>
    body { margin: 0; background: black; color: white; display: flex; align-items: center;}
    canvas { display: block }
  </style>
  <script>
    let interval = 1000;

    const W = 50;
    const H = 50;

    let game;
    let timeout;
    let SIZE;

    const c = document.getElementById("c");
    const ctx = c.getContext('2d');

    function init() {
      SIZE = Math.floor(Math.min(window.innerWidth, window.innerHeight) / 50);

      c.width = W * SIZE;
      c.height = H * SIZE;
    }

    function setup() {
      game = Array.from({ length: W }, () =>
        Array.from({ length: H }, () => (Math.random() < 0.3 ? 1 : 0))
      );
    }

    function count(x, y) {
      let n = 0;
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          if (dx === 0 && dy === 0) continue;
          n += game[(x + dx + W) % W][(y + dy + H) % H];
        }
      }
      return n;
    }

    function run() {
      var next = Array.from({length: W}, () => Array(H).fill(0));
      for (let i = 0; i < W; i++) {
        for (let j = 0; j < H; j++) {
          let n = count(i, j);
          if (game[i][j]) {
            next[i][j] = n == 2 || n == 3? 1: 0;
          } else {
            next[i][j] = n == 3? 1:0;
          }
        }
      }
      game = next;
    }

    function render() {
      for (let i = 0; i < W; i++) {
        for (let j = 0; j < H; j++) {
          ctx.fillStyle = game[i][j] ? "#0f0" : "#222";
          ctx.fillRect(i * SIZE, j * SIZE, SIZE - 1, SIZE - 1);
        }
      }
      timeout = setTimeout(() => {run(); render()}, interval);
    }

    init();
    setup();
    timeout = setTimeout(() => {run(); render()}, interval);
    setInterval(() => document.getElementById("interval").innerText = interval, 10);

    window.addEventListener("resize", init);
  </script>
</body>
