<body>
  <canvas id="c"></canvas>
  <style>
    body { margin: 0; background: black; display: flex; align-items: center; justify-content: center;}
    canvas { display: block }
  </style>
  <script>
    const W = 50;
    const H = 50;
    const SIZE = Math.min(window.innerWidth, window.innerHeight) / 50;

    const c = document.getElementById("c");
    const ctx = c.getContext('2d');
    c.width = W * SIZE;
    c.height = H * SIZE;

    let game = Array.from({ length: W }, () =>
      Array.from({ length: H }, () => (Math.random() < 0.3 ? 1 : 0))
    );

    function count(x, y) {
      let n = 0;
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          if (dx === 0 && dy === 0) continue;
          n += game[(x + dx + W) % W][(y + dy + H) % H];
        }
      }
      return n;
    }

    function run() {
      var next = Array.from({length: W}, () => Array(H).fill(0));
      for (let i = 0; i < W; i++) {
        for (let j = 0; j < H; j++) {
          let n = count(i, j);
          if (game[i][j]) {
            next[i][j] = n == 2 || n == 3? 1: 0;
          } else {
            next[i][j] = n == 3? 1:0;
          }
        }
      }
      game = next;
    }

    function render() {
      for (let i = 0; i < W; i++) {
        for (let j = 0; j < H; j++) {
          ctx.fillStyle = game[i][j] ? "#0f0" : "#222";
          ctx.fillRect(i * SIZE, j * SIZE, SIZE - 1, SIZE - 1);
        }
      }
    }

    setInterval(run, 1000);
    setInterval(render, 1000);
  </script>
</body>
